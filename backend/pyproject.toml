[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "certifi>=2025.8.3",
    "connexion[flask,swagger-ui,uvicorn]>=3.2.0",
    "dnspython>=2.7.0",
    "python-dotenv>=1.1.1",
    "flask>=3.1.1",
    "flask-apscheduler>=1.13.1",
    "flask-cors>=6.0.1",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=23.0.0",
    "markupsafe>=3.0.2",
    "mysqlclient>=2.2.7",
    "openapi-spec-validator>=0.7.2",
    "proxmoxer>=2.2.0",
    "python-dateutil>=2.9.0",
    "python-slugify>=8.0.4",
    "setuptools>=80.9.0",
    "six>=1.17.0",
    "urllib3>=2.5.0",
    "dotenv>=0.9.9",
]

[project.optional-dependencies]
test = [
    "coverage>=7.10.4",
    "pytest>=8.4.1",
    "pytest-mock>=3.14.1",
    "pytest-cov>=6.2.1",
    "pytest-dependency>=0.6.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "pylint>=3.3.8",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-dependency>=0.6.0",
    "pytest-mock>=3.14.1",
]
